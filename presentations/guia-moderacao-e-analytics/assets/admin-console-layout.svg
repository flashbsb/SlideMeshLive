<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" style="background: linear-gradient(135deg, #070a12 0%, #0b1528 100%); border-radius: 14px; font-family: system-ui, -apple-system, sans-serif; overflow: hidden;">
  <defs>
    <linearGradient id="adminHudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="headerAdminGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Title Header -->
  <text x="460" y="30" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="800" letter-spacing="2.5">SETORES OPERACIONAIS DA MESA TÉCNICA (/admin)</text>

  <!-- Sector 1: Navegação & Timeline -->
  <g transform="translate(30, 48)">
    <rect width="260" height="330" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="260" height="42" rx="14" fill="url(#headerAdminGrad)"/>
    <text x="130" y="26" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="800">1. NAVEGAÇÃO &amp; TEMPO</text>
    
    <g transform="translate(18, 60)">
      <circle cx="8" cy="8" r="4" fill="#06b6d4"/>
      <text x="20" y="12" fill="#f1f5f9" font-size="11.5" font-weight="700">Controle Síncrono de Slides</text>
      <text x="20" y="28" fill="#94a3b8" font-size="10">Miniaturas e avanço remoto invisível</text>
    </g>

    <g transform="translate(18, 110)">
      <circle cx="8" cy="8" r="4" fill="#06b6d4"/>
      <text x="20" y="12" fill="#f1f5f9" font-size="11.5" font-weight="700">Cronômetro de Apresentação</text>
      <text x="20" y="28" fill="#94a3b8" font-size="10">Tempo decorrido e contagem regressiva</text>
    </g>

    <g transform="translate(18, 160)">
      <circle cx="8" cy="8" r="4" fill="#06b6d4"/>
      <text x="20" y="12" fill="#f1f5f9" font-size="11.5" font-weight="700">Mural de Avisos para o Orador</text>
      <text x="20" y="28" fill="#94a3b8" font-size="10">Envio de alertas privados no púlpito</text>
    </g>

    <g transform="translate(16, 230)">
      <rect width="228" height="78" rx="8" fill="#1e293b" stroke="#0e7490"/>
      <text x="114" y="32" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="800">BASTIDORES INVISÍVEIS</text>
      <text x="114" y="52" text-anchor="middle" fill="#cbd5e1" font-size="10">Intervenções sem poluir o palco</text>
    </g>
  </g>

  <!-- Sector 2: Moderação & Enquetes -->
  <g transform="translate(330, 48)">
    <rect width="260" height="330" rx="14" fill="#090d16" stroke="#3b82f6" stroke-width="2"/>
    <rect width="260" height="42" rx="14" fill="#1d4ed8" fill-opacity="0.3"/>
    <text x="130" y="26" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="900">2. MODERAÇÃO &amp; ENQUETES</text>

    <g transform="translate(18, 60)">
      <circle cx="8" cy="8" r="4" fill="#3b82f6"/>
      <text x="20" y="12" fill="#f1f5f9" font-size="11.5" font-weight="700">Fila de Perguntas do Público</text>
      <text x="20" y="28" fill="#94a3b8" font-size="10">Aprovar, rejeitar e fixar no telão [M]</text>
    </g>

    <g transform="translate(18, 110)">
      <circle cx="8" cy="8" r="4" fill="#3b82f6"/>
      <text x="20" y="12" fill="#f1f5f9" font-size="11.5" font-weight="700">Abertura de Votação [V]</text>
      <text x="20" y="28" fill="#94a3b8" font-size="10">Libera enquetes sob demanda</text>
    </g>

    <g transform="translate(18, 160)">
      <circle cx="8" cy="8" r="4" fill="#3b82f6"/>
      <text x="20" y="12" fill="#f1f5f9" font-size="11.5" font-weight="700">Revelação de Resultados [R]</text>
      <text x="20" y="28" fill="#94a3b8" font-size="10">Animação de gráficos em tempo real</text>
    </g>

    <g transform="translate(16, 230)">
      <rect width="228" height="78" rx="8" fill="#1e293b" stroke="#1d4ed8"/>
      <text x="114" y="32" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="800">ENGAJAMENTO CONTROLADO</text>
      <text x="114" y="52" text-anchor="middle" fill="#cbd5e1" font-size="10">Filtro de spam e perguntas impróprias</text>
    </g>
  </g>

  <!-- Sector 3: Mídias, Segurança & Relatórios -->
  <g transform="translate(630, 48)">
    <rect width="260" height="330" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="260" height="42" rx="14" fill="#059669" fill-opacity="0.3"/>
    <text x="130" y="26" text-anchor="middle" fill="#34d399" font-size="12" font-weight="800">3. MÍDIAS &amp; SEGURANÇA</text>

    <g transform="translate(18, 60)">
      <circle cx="8" cy="8" r="4" fill="#10b981"/>
      <text x="20" y="12" fill="#f1f5f9" font-size="11.5" font-weight="700">Controle Remoto de Mídias</text>
      <text x="20" y="28" fill="#94a3b8" font-size="10">Play, Pause, Reiniciar e Mudo</text>
    </g>

    <g transform="translate(18, 110)">
      <circle cx="8" cy="8" r="4" fill="#10b981"/>
      <text x="20" y="12" fill="#f1f5f9" font-size="11.5" font-weight="700">Painel 🔐 Segurança RBAC</text>
      <text x="20" y="28" fill="#94a3b8" font-size="10">Gestão de PINs e contas de palestrante</text>
    </g>

    <g transform="translate(18, 160)">
      <circle cx="8" cy="8" r="4" fill="#10b981"/>
      <text x="20" y="12" fill="#f1f5f9" font-size="11.5" font-weight="700">Exportação de Relatórios</text>
      <text x="20" y="28" fill="#94a3b8" font-size="10">Download em CSV, Markdown e JSON</text>
    </g>

    <g transform="translate(16, 230)">
      <rect width="228" height="78" rx="8" fill="#064e3b" stroke="#10b981"/>
      <text x="114" y="32" text-anchor="middle" fill="#34d399" font-size="11" font-weight="800">GOVERNANÇA &amp; AUDITORIA</text>
      <text x="114" y="52" text-anchor="middle" fill="#a7f3d0" font-size="10">Armazenamento em sessions_archive/</text>
    </g>
  </g>
</svg>
