<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background: linear-gradient(135deg, #090d16 0%, #0f172a 100%); border-radius: 14px; font-family: system-ui, -apple-system, sans-serif; overflow: hidden;">
  <defs>
    <linearGradient id="gradRedHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradCyanHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes zzzFloatGentle {
      0% { transform: translate(0px, 0px); opacity: 0; }
      40% { opacity: 0.85; }
      100% { transform: translate(6px, -12px); opacity: 0; }
    }
    @keyframes barProgressLoop {
      0% { width: 45px; }
      50% { width: 175px; }
      100% { width: 45px; }
    }
    @keyframes vsPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .anim-zzz1 { animation: zzzFloatGentle 2.4s infinite ease-out; }
    .anim-zzz2 { animation: zzzFloatGentle 2.4s infinite ease-out 1.2s; }
    .anim-bar-live { animation: barProgressLoop 4s infinite ease-in-out; }
    .anim-vs-badge { animation: vsPulse 3s infinite ease-in-out; transform-origin: 480px 240px; }
  </style>

  <!-- Title Top Header -->
  <text x="480" y="32" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-weight="800" letter-spacing="2.5">O ABISMO DA ATENÇÃO: TRADICIONAL VS SLIDEMESHLIVE</text>

  <!-- ================= LEFT COLUMN: TRADICIONAL ================= -->
  <g transform="translate(25, 48)">
    <!-- Outer Card Background -->
    <rect width="430" height="412" rx="12" fill="#1e293b" fill-opacity="0.45" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4"/>
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="430" height="42" rx="12" fill="url(#gradRedHeader)" fill-opacity="0.25"/>
    <text x="215" y="27" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="800">💀 APRESENTAÇÃO TRADICIONAL</text>
    
    <!-- Persona 1: Sleeping -->
    <g transform="translate(60, 60)">
      <circle cx="32" cy="32" r="25" fill="#334155" stroke="#ef4444" stroke-width="1.5"/>
      <text x="32" y="40" text-anchor="middle" font-size="22">😴</text>
      
      <!-- Small Zzz indicator constrained safely -->
      <g transform="translate(48, 14)">
        <text x="0" y="0" fill="#f87171" font-size="11" font-weight="900" class="anim-zzz1">z</text>
        <text x="8" y="-6" fill="#fca5a5" font-size="13" font-weight="900" class="anim-zzz2">Z</text>
      </g>
      
      <text x="32" y="74" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">Sono Pós-Almoço</text>
      <text x="32" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">"Quantos faltam?..."</text>
    </g>

    <!-- Persona 2: Distracted -->
    <g transform="translate(245, 60)">
      <circle cx="32" cy="32" r="25" fill="#334155" stroke="#ef4444" stroke-width="1.5"/>
      <text x="32" y="40" text-anchor="middle" font-size="22">📱</text>
      <text x="32" y="74" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">Rolando Feed</text>
      <text x="32" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">Instagram &amp; Redes</text>
    </g>

    <!-- Problems Detail Box -->
    <g transform="translate(18, 170)">
      <rect width="394" height="224" rx="10" fill="#0f172a" stroke="#334155"/>
      <text x="18" y="28" fill="#ef4444" font-size="12" font-weight="800">❌ Problemas do Modelo Convencional:</text>
      
      <!-- Item 1 -->
      <circle cx="24" cy="56" r="3" fill="#ef4444"/>
      <text x="36" y="60" fill="#cbd5e1" font-size="11.5">Telão poluído com dezenas de linhas de texto</text>
      
      <!-- Item 2 -->
      <circle cx="24" cy="88" r="3" fill="#ef4444"/>
      <text x="36" y="92" fill="#cbd5e1" font-size="11.5">Orador preso lendo slides de costas para o público</text>
      
      <!-- Item 3 -->
      <circle cx="24" cy="120" r="3" fill="#ef4444"/>
      <text x="36" y="124" fill="#cbd5e1" font-size="11.5">"Não sei se quem está no fundo consegue ler..."</text>
      
      <!-- Item 4 -->
      <circle cx="24" cy="152" r="3" fill="#ef4444"/>
      <text x="36" y="156" fill="#cbd5e1" font-size="11.5">Microfone caótico para perguntas sem moderação</text>

      <!-- Bottom Alert Pill -->
      <rect x="18" y="180" width="358" height="28" rx="6" fill="#450a0a" fill-opacity="0.6" stroke="#991b1b" stroke-width="1"/>
      <text x="197" y="198" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">Resultado: 90% da plateia desatenta e passiva</text>
    </g>
  </g>

  <!-- ================= CENTER VS BADGE ================= -->
  <g class="anim-vs-badge">
    <circle cx="480" cy="254" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="480" y="260" text-anchor="middle" fill="#38bdf8" font-size="12.5" font-weight="900">VS</text>
  </g>

  <!-- ================= RIGHT COLUMN: SLIDEMESHLIVE ================= -->
  <g transform="translate(505, 48)">
    <!-- Outer Card Background -->
    <rect width="430" height="412" rx="12" fill="#0f172a" fill-opacity="0.95" stroke="#0ea5e9" stroke-width="2"/>
    
    <!-- Header Bar -->
    <rect x="0" y="0" width="430" height="42" rx="12" fill="url(#gradCyanHeader)" fill-opacity="0.3"/>
    <text x="215" y="27" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="900">⚡ EXPERIÊNCIA SLIDEMESHLIVE</text>

    <!-- Engaged 1: Voting -->
    <g transform="translate(60, 60)">
      <circle cx="32" cy="32" r="25" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#softGlowCyan)"/>
      <text x="32" y="40" text-anchor="middle" font-size="22">🗳️</text>
      <text x="32" y="74" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="800">Votando ao Vivo</text>
      <text x="32" y="90" text-anchor="middle" fill="#38bdf8" font-size="10">Gráficos em tempo real</text>
    </g>

    <!-- Engaged 2: Asking -->
    <g transform="translate(245, 60)">
      <circle cx="32" cy="32" r="25" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#softGlowCyan)"/>
      <text x="32" y="40" text-anchor="middle" font-size="22">💬</text>
      <text x="32" y="74" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="800">Enviando Dúvida</text>
      <text x="32" y="90" text-anchor="middle" fill="#38bdf8" font-size="10">Destaque no Telão!</text>
    </g>

    <!-- Solutions Detail Box -->
    <g transform="translate(18, 170)">
      <rect width="394" height="224" rx="10" fill="#1e293b" stroke="#0284c7"/>
      <text x="18" y="28" fill="#38bdf8" font-size="12" font-weight="800">✓ Vantagens do Ecossistema Interativo:</text>
      
      <!-- Live Progress Bar Widget -->
      <g transform="translate(18, 42)">
        <rect width="210" height="16" rx="4" fill="#0f172a"/>
        <rect height="16" rx="4" fill="#06b6d4" class="anim-bar-live"/>
        <text x="222" y="13" fill="#38bdf8" font-size="11" font-weight="800">92% Votos</text>
      </g>

      <!-- Item 1 -->
      <circle cx="24" cy="82" r="3" fill="#38bdf8"/>
      <text x="36" y="86" fill="#cbd5e1" font-size="11.5">Telão limpo, tipográfico e inspirador</text>
      
      <!-- Item 2 -->
      <circle cx="24" cy="112" r="3" fill="#38bdf8"/>
      <text x="36" y="116" fill="#cbd5e1" font-size="11.5">Celular com tabelas, códigos e notas completas</text>
      
      <!-- Item 3 -->
      <circle cx="24" cy="142" r="3" fill="#38bdf8"/>
      <text x="36" y="146" fill="#cbd5e1" font-size="11.5">Moderação de perguntas em 1 clique na mesa técnica</text>

      <!-- Bottom Success Pill -->
      <rect x="18" y="174" width="358" height="34" rx="6" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1"/>
      <text x="197" y="196" text-anchor="middle" fill="#6ee7b7" font-size="11.5" font-weight="800">✓ 100% de engajamento e atenção da sala</text>
    </g>
  </g>
</svg>
