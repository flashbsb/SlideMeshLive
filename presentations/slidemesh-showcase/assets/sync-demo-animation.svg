<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%" style="background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%); border-radius: 14px; font-family: system-ui, -apple-system, sans-serif; overflow: hidden;">
  <style>
    @keyframes streamFwd {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(390px); opacity: 0; }
    }
    @keyframes streamBwd {
      0% { transform: translateX(390px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(0px); opacity: 0; }
    }
    @keyframes badgePulse {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.9)); }
    }
    .anim-stream-fwd { animation: streamFwd 2s infinite ease-in-out; }
    .anim-stream-bwd { animation: streamBwd 2s infinite ease-in-out; }
    .anim-badge-glow { animation: badgePulse 2.5s infinite ease-in-out; }
  </style>

  <!-- Title -->
  <text x="460" y="34" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="2.5">FLUXO BIDIRECIONAL EM TEMPO REAL: VELOCIDADE &lt;50ms</text>

  <!-- Left: Presenter Node -->
  <g transform="translate(40, 55)">
    <rect width="210" height="235" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" class="anim-badge-glow"/>
    <text x="105" y="38" text-anchor="middle" font-size="28">🖥️</text>
    <text x="105" y="70" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="800">TELÃO / PALCO</text>
    
    <rect x="20" y="90" width="170" height="28" rx="6" fill="#0284c7" fill-opacity="0.3"/>
    <text x="105" y="108" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="800">Slide #4 Avançou</text>
    
    <text x="105" y="145" text-anchor="middle" fill="#94a3b8" font-size="11">BroadcastChannel (0ms)</text>
    <text x="105" y="172" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">✓ Evento Disparado</text>
    <text x="105" y="202" text-anchor="middle" fill="#64748b" font-size="10.5">Sem delay perceptual</text>
  </g>

  <!-- Center Data Stream Area -->
  <g transform="translate(250, 55)">
    <!-- Forward Stream Line (Presenter -> Audience) -->
    <g transform="translate(0, 55)">
      <line x1="20" y1="0" x2="390" y2="0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,6"/>
      <g transform="translate(20, 0)">
        <circle cx="0" cy="0" r="7" fill="#38bdf8" class="anim-stream-fwd"/>
      </g>
      <rect x="115" y="-22" width="180" height="20" rx="4" fill="#0f172a" stroke="#0284c7"/>
      <text x="205" y="-8" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="800">SLIDE_CHANGE ➔ &lt;10ms</text>
    </g>

    <!-- Center Info Badge -->
    <g transform="translate(130, 105)">
      <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="75" y="21" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">⚡ Sincronia Ultra-Rápida</text>
    </g>

    <!-- Backward Stream Line (Audience -> Presenter) -->
    <g transform="translate(0, 185)">
      <line x1="20" y1="0" x2="390" y2="0" stroke="#a855f7" stroke-width="3" stroke-dasharray="8,6"/>
      <g transform="translate(20, 0)">
        <circle cx="0" cy="0" r="7" fill="#c084fc" class="anim-stream-bwd"/>
      </g>
      <rect x="115" y="6" width="180" height="20" rx="4" fill="#0f172a" stroke="#7e22ce"/>
      <text x="205" y="20" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="800">VOTE / QUESTION ➔ &lt;20ms</text>
    </g>
  </g>

  <!-- Right: Audience Mobile Node -->
  <g transform="translate(670, 55)">
    <rect width="210" height="235" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="2" class="anim-badge-glow"/>
    <text x="105" y="38" text-anchor="middle" font-size="28">📱</text>
    <text x="105" y="70" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="800">SMARTPHONE</text>
    
    <rect x="20" y="90" width="170" height="28" rx="6" fill="#7e22ce" fill-opacity="0.3"/>
    <text x="105" y="108" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="800">Slide Sincronizado!</text>
    
    <text x="105" y="145" text-anchor="middle" fill="#94a3b8" font-size="11">Voto computado ao vivo</text>
    <text x="105" y="172" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">✓ Resposta Háptica Tátil</text>
    <text x="105" y="202" text-anchor="middle" fill="#64748b" font-size="10.5">Tudo instantâneo na tela</text>
  </g>
</svg>
