<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" height="100%" style="background: #0b0f19; border-radius: 12px; font-family: system-ui, -apple-system, sans-serif;">
  <text x="410" y="32" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="2">4 TEMAS VISUAIS NATIVOS HSL (ZERO-DEPENDENCY THEME ENGINE)</text>

  <!-- Theme 1: Dark (Default) -->
  <g transform="translate(30, 55)">
    <rect width="170" height="235" rx="8" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#0284c7" fill-opacity="0.3"/>
    <text x="85" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="800">🌙 DARK (PADRÃO)</text>
    <circle cx="85" cy="70" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="85" y="77" text-anchor="middle" font-size="18">🌌</text>
    <text x="85" y="115" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Auditórios Escuros</text>
    <text x="85" y="135" text-anchor="middle" fill="#94a3b8" font-size="9.5">Preto profundo + Ciano</text>
    <rect x="25" y="160" width="120" height="24" rx="4" fill="#38bdf8"/>
    <text x="85" y="176" text-anchor="middle" fill="#090d16" font-size="10" font-weight="800">Ciano Primário</text>
    <text x="85" y="210" text-anchor="middle" fill="#64748b" font-size="9">Máximo contraste OLED</text>
  </g>

  <!-- Theme 2: Light -->
  <g transform="translate(225, 55)">
    <rect width="170" height="235" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#e2e8f0"/>
    <text x="85" y="20" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="800">☀️ LIGHT EDITORIAL</text>
    <circle cx="85" cy="70" r="22" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="85" y="77" text-anchor="middle" font-size="18">☀️</text>
    <text x="85" y="115" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="700">Salas Iluminadas</text>
    <text x="85" y="135" text-anchor="middle" fill="#64748b" font-size="9.5">Branco puro + Azul</text>
    <rect x="25" y="160" width="120" height="24" rx="4" fill="#0284c7"/>
    <text x="85" y="176" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">Azul Corporativo</text>
    <text x="85" y="210" text-anchor="middle" fill="#64748b" font-size="9">Ideal p/ salas de aula</text>
  </g>

  <!-- Theme 3: Slate -->
  <g transform="translate(420, 55)">
    <rect width="170" height="235" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#4f46e5" fill-opacity="0.3"/>
    <text x="85" y="20" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="800">🪐 SLATE SOFISTICADO</text>
    <circle cx="85" cy="70" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <text x="85" y="77" text-anchor="middle" font-size="18">🪐</text>
    <text x="85" y="115" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Eventos Executivos</text>
    <text x="85" y="135" text-anchor="middle" fill="#cbd5e1" font-size="9.5">Índigo + Ardósia</text>
    <rect x="25" y="160" width="120" height="24" rx="4" fill="#818cf8"/>
    <text x="85" y="176" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="800">Índigo Acento</text>
    <text x="85" y="210" text-anchor="middle" fill="#94a3b8" font-size="9">Estética elegante</text>
  </g>

  <!-- Theme 4: High Contrast -->
  <g transform="translate(615, 55)">
    <rect width="170" height="235" rx="8" fill="#000000" stroke="#facc15" stroke-width="2.5"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#facc15"/>
    <text x="85" y="20" text-anchor="middle" fill="#000000" font-size="11" font-weight="900">👁️ HIGH CONTRAST</text>
    <circle cx="85" cy="70" r="22" fill="#000000" stroke="#facc15" stroke-width="2.5"/>
    <text x="85" y="77" text-anchor="middle" font-size="18">⚡</text>
    <text x="85" y="115" text-anchor="middle" fill="#facc15" font-size="11" font-weight="900">Acessibilidade Total</text>
    <text x="85" y="135" text-anchor="middle" fill="#ffffff" font-size="9.5">Preto 100% + Amarelo</text>
    <rect x="25" y="160" width="120" height="24" rx="4" fill="#facc15"/>
    <text x="85" y="176" text-anchor="middle" fill="#000000" font-size="10" font-weight="900">WCAG AAA (7:1+)</text>
    <text x="85" y="210" text-anchor="middle" fill="#fef08a" font-size="9">Baixa visão / Daltonismo</text>
  </g>
</svg>
