<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" style="background: linear-gradient(135deg, #090d16 0%, #0f172a 100%); border-radius: 14px; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes zzzFloat {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-24px) translateX(10px) scale(1.2); opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.9)); }
    }
    @keyframes floatBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes voteBarGrow {
      0% { width: 40px; }
      50% { width: 140px; }
      100% { width: 40px; }
    }
    @keyframes badgeSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .zzz-1 { animation: zzzFloat 2.4s infinite ease-out; }
    .zzz-2 { animation: zzzFloat 2.4s infinite ease-out 1.2s; }
    .pulse-live { animation: pulseGlow 2s infinite ease-in-out; }
    .float-card { animation: floatBounce 3s infinite ease-in-out; }
    .anim-bar { animation: voteBarGrow 4s infinite ease-in-out; }
  </style>

  <!-- Title Banner -->
  <text x="450" y="36" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="800" letter-spacing="2.5">O ABISMO DA ATENÇÃO: TRADICIONAL VS SLIDEMESHLIVE</text>

  <!-- Left Box: PowerPoint Tradicional -->
  <g transform="translate(35, 55)">
    <rect width="385" height="335" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="385" height="46" rx="12" fill="url(#gradRed)" fill-opacity="0.3"/>
    <text x="192" y="29" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="800">💀 APRESENTAÇÃO TRADICIONAL</text>
    
    <!-- Illustrative Persona 1: Sleeping -->
    <g transform="translate(45, 68)">
      <circle cx="35" cy="35" r="26" fill="#334155" stroke="#ef4444" stroke-width="2"/>
      <text x="35" y="43" text-anchor="middle" font-size="24">😴</text>
      <!-- Zzz floating text -->
      <text x="58" y="20" fill="#f87171" font-size="12" font-weight="900" class="zzz-1">z</text>
      <text x="68" y="10" fill="#fca5a5" font-size="14" font-weight="900" class="zzz-2">Z</text>
      <text x="35" y="80" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="700">Sono Pós-Almoço</text>
      <text x="35" y="96" text-anchor="middle" fill="#94a3b8" font-size="10">"Quantos faltam?..."</text>
    </g>

    <!-- Illustrative Persona 2: Distracted -->
    <g transform="translate(210, 68)">
      <circle cx="35" cy="35" r="26" fill="#334155" stroke="#ef4444" stroke-width="2"/>
      <text x="35" y="43" text-anchor="middle" font-size="24">📱</text>
      <text x="35" y="80" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="700">Rolando Feed</text>
      <text x="35" y="96" text-anchor="middle" fill="#94a3b8" font-size="10">Instagram &amp; WhatsApp</text>
    </g>

    <!-- Tiny Text Board -->
    <g transform="translate(25, 185)">
      <rect width="335" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="16" y="26" fill="#ef4444" font-size="12" font-weight="800">❌ O Telão Monótono:</text>
      <text x="16" y="50" fill="#94a3b8" font-size="11">• 40 linhas de texto em corpo 9</text>
      <text x="16" y="70" fill="#94a3b8" font-size="11">• Orador lendo cada linha de costas</text>
      <text x="16" y="90" fill="#94a3b8" font-size="11">• "Não sei se dá para ler lá atrás..."</text>
      <text x="16" y="108" fill="#f87171" font-size="10.5" font-weight="600">Zero interação • Auditório passivo</text>
    </g>
  </g>

  <!-- Center VS Badge with animated pulse -->
  <g transform="translate(425, 195)">
    <circle cx="25" cy="25" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" class="pulse-live"/>
    <text x="25" y="32" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="900">VS</text>
  </g>

  <!-- Right Box: SlideMeshLive -->
  <g transform="translate(480, 55)" class="float-card">
    <rect width="385" height="335" rx="12" fill="#0f172a" fill-opacity="0.95" stroke="#0ea5e9" stroke-width="2.5" class="pulse-live"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="385" height="46" rx="12" fill="url(#gradCyan)" fill-opacity="0.35"/>
    <text x="192" y="29" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="900">⚡ EXPERIÊNCIA SLIDEMESHLIVE</text>

    <!-- Engaged Person 1 -->
    <g transform="translate(45, 68)">
      <circle cx="35" cy="35" r="26" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowCyan)"/>
      <text x="35" y="43" text-anchor="middle" font-size="24">🗳️</text>
      <text x="35" y="80" text-anchor="middle" fill="#e0f2fe" font-size="11.5" font-weight="800">Votando ao Vivo</text>
      <text x="35" y="96" text-anchor="middle" fill="#38bdf8" font-size="10">Gráfico sobe na hora</text>
    </g>

    <!-- Engaged Person 2 -->
    <g transform="translate(210, 68)">
      <circle cx="35" cy="35" r="26" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowCyan)"/>
      <text x="35" y="43" text-anchor="middle" font-size="24">💬</text>
      <text x="35" y="80" text-anchor="middle" fill="#e0f2fe" font-size="11.5" font-weight="800">Enviando Dúvida</text>
      <text x="35" y="96" text-anchor="middle" fill="#38bdf8" font-size="10">Destaque no Telão!</text>
    </g>

    <!-- Interactive Simulated Bar Card -->
    <g transform="translate(25, 185)">
      <rect width="335" height="120" rx="8" fill="#1e293b" stroke="#0284c7"/>
      <text x="16" y="26" fill="#38bdf8" font-size="12" font-weight="800">✓ Telão Limpo + Celular Dinâmico:</text>
      
      <!-- Animated vote bar -->
      <g transform="translate(16, 40)">
        <rect width="180" height="16" rx="4" fill="#0f172a"/>
        <rect height="16" rx="4" fill="#06b6d4" class="anim-bar"/>
        <text x="190" y="13" fill="#38bdf8" font-size="10.5" font-weight="800">92% Votos</text>
      </g>

      <text x="16" y="82" fill="#cbd5e1" font-size="11">• Sincronia instantânea em rede local</text>
      <text x="16" y="102" fill="#34d399" font-size="11" font-weight="700">✓ 100% de atenção e participação da plateia</text>
    </g>
  </g>
</svg>
