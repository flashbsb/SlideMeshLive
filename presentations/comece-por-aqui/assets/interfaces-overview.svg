<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" style="background: linear-gradient(135deg, #070a12 0%, #0d1527 100%); border-radius: 14px; font-family: system-ui, -apple-system, sans-serif; overflow: hidden;">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <!-- Title Header -->
  <text x="460" y="30" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="800" letter-spacing="2.5">O ESCOPO DAS 5 INTERFACES WEB DO SLIDEMESHLIVE</text>

  <!-- Card 1: Portal Inicial -->
  <g transform="translate(25, 48)">
    <rect width="160" height="330" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="160" height="40" rx="12" fill="url(#cardGrad1)" fill-opacity="0.3"/>
    <text x="80" y="25" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="800">🏠 PORTAL INICIAL</text>
    
    <text x="14" y="66" fill="#e2e8f0" font-size="11" font-weight="700">Rota: /</text>
    <text x="14" y="92" fill="#94a3b8" font-size="10">• Catálogo de Decks</text>
    <text x="14" y="114" fill="#94a3b8" font-size="10">• Setup de Segurança</text>
    <text x="14" y="136" fill="#94a3b8" font-size="10">• Exportação ZIP</text>
    <text x="14" y="158" fill="#94a3b8" font-size="10">• Seletor PT / EN</text>

    <g transform="translate(12, 260)">
      <rect width="136" height="38" rx="6" fill="#1e293b" stroke="#0284c7"/>
      <text x="68" y="24" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">Ponto de Entrada</text>
    </g>
  </g>

  <!-- Card 2: Telão do Palco -->
  <g transform="translate(200, 48)">
    <rect width="160" height="330" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="160" height="40" rx="12" fill="url(#cardGrad2)" fill-opacity="0.3"/>
    <text x="80" y="25" text-anchor="middle" fill="#a5b4fc" font-size="11.5" font-weight="800">🖥️ TELÃO PALCO</text>
    
    <text x="14" y="66" fill="#e2e8f0" font-size="11" font-weight="700">/presenter</text>
    <text x="14" y="92" fill="#94a3b8" font-size="10">• Projeção Limpa</text>
    <text x="14" y="114" fill="#94a3b8" font-size="10">• Modo Púlpito [P]</text>
    <text x="14" y="136" fill="#94a3b8" font-size="10">• Mural de Dúvidas [M]</text>
    <text x="14" y="158" fill="#94a3b8" font-size="10">• QR Code Gigante [Q]</text>

    <g transform="translate(12, 260)">
      <rect width="136" height="38" rx="6" fill="#1e293b" stroke="#4f46e5"/>
      <text x="68" y="24" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="700">Para o Palestrante</text>
    </g>
  </g>

  <!-- Card 3: Mesa Técnica -->
  <g transform="translate(375, 48)">
    <rect width="168" height="330" rx="12" fill="#090d16" stroke="#10b981" stroke-width="2"/>
    <rect width="168" height="40" rx="12" fill="url(#cardGrad3)" fill-opacity="0.35"/>
    <text x="84" y="25" text-anchor="middle" fill="#34d399" font-size="11.5" font-weight="800">🎧 MESA TÉCNICA</text>
    
    <text x="14" y="66" fill="#e2e8f0" font-size="11" font-weight="700">/admin</text>
    <text x="14" y="92" fill="#94a3b8" font-size="10">• Moderação Q&amp;A</text>
    <text x="14" y="114" fill="#94a3b8" font-size="10">• Controle de Enquetes</text>
    <text x="14" y="136" fill="#94a3b8" font-size="10">• Controle de Mídias</text>
    <text x="14" y="158" fill="#94a3b8" font-size="10">• HUD de Diagnóstico</text>

    <g transform="translate(14, 260)">
      <rect width="140" height="38" rx="6" fill="#064e3b" stroke="#10b981"/>
      <text x="70" y="24" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">Para o Operador</text>
    </g>
  </g>

  <!-- Card 4: Audiência Mobile -->
  <g transform="translate(560, 48)">
    <rect width="160" height="330" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="160" height="40" rx="12" fill="url(#cardGrad4)" fill-opacity="0.3"/>
    <text x="80" y="25" text-anchor="middle" fill="#fbbf24" font-size="11.5" font-weight="800">📱 AUDIÊNCIA</text>
    
    <text x="14" y="66" fill="#e2e8f0" font-size="11" font-weight="700">/audience</text>
    <text x="14" y="92" fill="#94a3b8" font-size="10">• Acesso via QR Code</text>
    <text x="14" y="114" fill="#94a3b8" font-size="10">• Voto com 1 Toque</text>
    <text x="14" y="136" fill="#94a3b8" font-size="10">• Envio de Dúvidas</text>
    <text x="14" y="158" fill="#94a3b8" font-size="10">• Desbloqueio por PIN</text>

    <g transform="translate(12, 260)">
      <rect width="136" height="38" rx="6" fill="#1e293b" stroke="#d97706"/>
      <text x="68" y="24" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">Para o Participante</text>
    </g>
  </g>

  <!-- Card 5: SlideMesh Studio -->
  <g transform="translate(735, 48)">
    <rect width="160" height="330" rx="12" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="160" height="40" rx="12" fill="url(#cardGrad5)" fill-opacity="0.3"/>
    <text x="80" y="25" text-anchor="middle" fill="#f472b6" font-size="11.5" font-weight="800">✨ STUDIO</text>
    
    <text x="14" y="66" fill="#e2e8f0" font-size="11" font-weight="700">/import.html</text>
    <text x="14" y="92" fill="#94a3b8" font-size="10">• 4 Templates Prontos</text>
    <text x="14" y="114" fill="#94a3b8" font-size="10">• Importador PPTX/DOCX</text>
    <text x="14" y="136" fill="#94a3b8" font-size="10">• Editor Visual de Slides</text>
    <text x="14" y="158" fill="#94a3b8" font-size="10">• Exportador .zip</text>

    <g transform="translate(12, 260)">
      <rect width="136" height="38" rx="6" fill="#1e293b" stroke="#db2777"/>
      <text x="68" y="24" text-anchor="middle" fill="#f472b6" font-size="10" font-weight="700">Para o Criador</text>
    </g>
  </g>
</svg>
