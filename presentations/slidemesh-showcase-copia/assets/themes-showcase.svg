<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background: #090d16; border-radius: 14px; font-family: system-ui, -apple-system, sans-serif; overflow: hidden;">
  <style>
    @keyframes themePulseGlow {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(56, 189, 248, 0.25)); }
      50% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.65)); }
    }
    .anim-card-dark { animation: themePulseGlow 3s infinite ease-in-out; }
  </style>

  <!-- Top Title -->
  <text x="480" y="34" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-weight="800" letter-spacing="2.5">4 TEMAS VISUAIS NATIVOS HSL (ZERO-DEPENDENCY THEME ENGINE)</text>

  <!-- ================= THEME 1: DARK (DEFAULT) ================= -->
  <g transform="translate(43, 56)" class="anim-card-dark">
    <rect width="205" height="390" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="205" height="38" rx="12" fill="#0284c7" fill-opacity="0.3"/>
    <text x="102" y="24" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="800">🌙 DARK (PADRÃO)</text>
    
    <circle cx="102" cy="85" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="102" y="93" text-anchor="middle" font-size="22">🌌</text>
    
    <text x="102" y="140" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">Auditórios Escuros</text>
    <text x="102" y="162" text-anchor="middle" fill="#94a3b8" font-size="11">Preto profundo + Ciano</text>
    <text x="102" y="180" text-anchor="middle" fill="#64748b" font-size="10.5">Contraste OLED puro</text>

    <!-- Color Swatch -->
    <g transform="translate(22, 210)">
      <rect width="161" height="36" rx="6" fill="#38bdf8"/>
      <text x="80" y="23" text-anchor="middle" fill="#090d16" font-size="11.5" font-weight="900">#38bdf8 (Ciano)</text>
    </g>

    <!-- Detail Box -->
    <g transform="translate(16, 265)">
      <rect width="173" height="105" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155"/>
      <text x="12" y="24" fill="#38bdf8" font-size="11" font-weight="700">• Alta imersão</text>
      <text x="12" y="48" fill="#cbd5e1" font-size="10.5">• Economia de bateria</text>
      <text x="12" y="72" fill="#cbd5e1" font-size="10.5">• Ideal para projeção</text>
      <text x="12" y="94" fill="#34d399" font-size="10" font-weight="700">✓ Padrão da plataforma</text>
    </g>
  </g>

  <!-- ================= THEME 2: LIGHT ================= -->
  <g transform="translate(266, 56)">
    <rect width="205" height="390" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="0" y="0" width="205" height="38" rx="12" fill="#e2e8f0"/>
    <text x="102" y="24" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="800">☀️ LIGHT EDITORIAL</text>
    
    <circle cx="102" cy="85" r="26" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="102" y="93" text-anchor="middle" font-size="22">☀️</text>
    
    <text x="102" y="140" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="800">Salas Iluminadas</text>
    <text x="102" y="162" text-anchor="middle" fill="#64748b" font-size="11">Branco puro + Azul</text>
    <text x="102" y="180" text-anchor="middle" fill="#94a3b8" font-size="10.5">Nitidez em salas de aula</text>

    <!-- Color Swatch -->
    <g transform="translate(22, 210)">
      <rect width="161" height="36" rx="6" fill="#0284c7"/>
      <text x="80" y="23" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="900">#0284c7 (Azul)</text>
    </g>

    <!-- Detail Box -->
    <g transform="translate(16, 265)">
      <rect width="173" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="24" fill="#0284c7" font-size="11" font-weight="700">• Estética clean</text>
      <text x="12" y="48" fill="#475569" font-size="10.5">• Leitura de documentos</text>
      <text x="12" y="72" fill="#475569" font-size="10.5">• Impressão perfeita</text>
      <text x="12" y="94" fill="#0369a1" font-size="10" font-weight="700">✓ Ambientes claros</text>
    </g>
  </g>

  <!-- ================= THEME 3: SLATE ================= -->
  <g transform="translate(489, 56)">
    <rect width="205" height="390" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect x="0" y="0" width="205" height="38" rx="12" fill="#4f46e5" fill-opacity="0.3"/>
    <text x="102" y="24" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="800">🪐 SLATE EXECUTIVO</text>
    
    <circle cx="102" cy="85" r="26" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <text x="102" y="93" text-anchor="middle" font-size="22">🪐</text>
    
    <text x="102" y="140" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">Eventos Corporativos</text>
    <text x="102" y="162" text-anchor="middle" fill="#cbd5e1" font-size="11">Índigo + Ardósia</text>
    <text x="102" y="180" text-anchor="middle" fill="#94a3b8" font-size="10.5">Estética refinada</text>

    <!-- Color Swatch -->
    <g transform="translate(22, 210)">
      <rect width="161" height="36" rx="6" fill="#818cf8"/>
      <text x="80" y="23" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="900">#818cf8 (Índigo)</text>
    </g>

    <!-- Detail Box -->
    <g transform="translate(16, 265)">
      <rect width="173" height="105" rx="8" fill="#0f172a" stroke="#475569"/>
      <text x="12" y="24" fill="#a5b4fc" font-size="11" font-weight="700">• Visual sofisticado</text>
      <text x="12" y="48" fill="#cbd5e1" font-size="10.5">• Conforto prolongado</text>
      <text x="12" y="72" fill="#cbd5e1" font-size="10.5">• Apresentações C-Level</text>
      <text x="12" y="94" fill="#818cf8" font-size="10" font-weight="700">✓ Equilíbrio de cores</text>
    </g>
  </g>

  <!-- ================= THEME 4: HIGH CONTRAST ================= -->
  <g transform="translate(712, 56)">
    <rect width="205" height="390" rx="12" fill="#000000" stroke="#facc15" stroke-width="2.5"/>
    <rect x="0" y="0" width="205" height="38" rx="12" fill="#facc15"/>
    <text x="102" y="24" text-anchor="middle" fill="#000000" font-size="12" font-weight="900">👁️ HIGH CONTRAST</text>
    
    <circle cx="102" cy="85" r="26" fill="#000000" stroke="#facc15" stroke-width="2.5"/>
    <text x="102" y="93" text-anchor="middle" font-size="22">⚡</text>
    
    <text x="102" y="140" text-anchor="middle" fill="#facc15" font-size="13" font-weight="900">Acessibilidade Total</text>
    <text x="102" y="162" text-anchor="middle" fill="#ffffff" font-size="11">Preto 100% + Amarelo</text>
    <text x="102" y="180" text-anchor="middle" fill="#fef08a" font-size="10.5">Diretrizes WCAG AAA</text>

    <!-- Color Swatch -->
    <g transform="translate(22, 210)">
      <rect width="161" height="36" rx="6" fill="#facc15"/>
      <text x="80" y="23" text-anchor="middle" fill="#000000" font-size="11.5" font-weight="900">#facc15 (Amarelo)</text>
    </g>

    <!-- Detail Box -->
    <g transform="translate(16, 265)">
      <rect width="173" height="105" rx="8" fill="#000000" stroke="#facc15"/>
      <text x="12" y="24" fill="#facc15" font-size="11" font-weight="900">• Razão &gt; 7:1 (AAA)</text>
      <text x="12" y="48" fill="#ffffff" font-size="10.5">• Baixa visão e idosos</text>
      <text x="12" y="72" fill="#ffffff" font-size="10.5">• Daltonismo universal</text>
      <text x="12" y="94" fill="#fef08a" font-size="10" font-weight="800">✓ Inclusão máxima</text>
    </g>
  </g>
</svg>
