<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%" style="background: linear-gradient(135deg, #0b0f19 0%, #0f172a 100%); border-radius: 14px; font-family: system-ui, -apple-system, sans-serif; overflow: hidden;">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glowPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes moveDotForward {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(95px); opacity: 0; }
    }
    @keyframes moveDotBackward {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(-95px); opacity: 0; }
    }
    @keyframes hubScaleGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.3)); }
      50% { transform: scale(1.02); filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.7)); }
    }
    .anim-dot-fwd { animation: moveDotForward 1.6s infinite ease-in-out; }
    .anim-dot-bwd { animation: moveDotBackward 1.6s infinite ease-in-out 0.8s; }
    .anim-hub { animation: hubScaleGlow 3s infinite ease-in-out; transform-origin: 460px 195px; }
  </style>

  <!-- Title -->
  <text x="460" y="34" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="800" letter-spacing="2.5">MALHA DE SINCRONIZAÇÃO EM TEMPO REAL (QUAD-LAYER MESH)</text>

  <!-- Left: Presenter Stage -->
  <g transform="translate(35, 60)">
    <rect width="250" height="295" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="42" rx="12" fill="#0284c7" fill-opacity="0.3"/>
    <text x="125" y="27" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="800">🖥️ TELÃO DO PALCO</text>
    
    <text x="20" y="76" fill="#e2e8f0" font-size="12" font-weight="700">• Alta Legibilidade</text>
    <text x="20" y="98" fill="#94a3b8" font-size="11">Bullets sintetizados e claros</text>
    
    <text x="20" y="136" fill="#e2e8f0" font-size="12" font-weight="700">• Gráficos ao Vivo</text>
    <text x="20" y="158" fill="#94a3b8" font-size="11">Votação com apuração em 0ms</text>

    <text x="20" y="196" fill="#e2e8f0" font-size="12" font-weight="700">• Perguntas em Destaque</text>
    <text x="20" y="218" fill="#94a3b8" font-size="11">Banner flutuante animado</text>

    <g transform="translate(15, 242)">
      <rect width="220" height="38" rx="6" fill="#0f172a" stroke="#0284c7"/>
      <text x="110" y="24" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="700">Teclado de atalhos e púlpito</text>
    </g>
  </g>

  <!-- Connection Lines & Animated Flow -->
  <!-- Left to Center Line -->
  <line x1="285" y1="195" x2="385" y2="195" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <g transform="translate(285, 195)">
    <circle cx="0" cy="0" r="6" fill="#38bdf8" class="anim-dot-fwd"/>
  </g>

  <!-- Center: Hub Local / BroadcastChannel -->
  <g class="anim-hub">
    <g transform="translate(360, 60)">
      <rect width="200" height="295" rx="16" fill="#0f172a" stroke="url(#hubGrad)" stroke-width="2.5" filter="url(#glowPulse)"/>
      <circle cx="100" cy="48" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="100" y="56" text-anchor="middle" font-size="22">⚡</text>
      
      <text x="100" y="100" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="900">HUB DE SINCRONIA</text>
      
      <rect x="15" y="118" width="170" height="26" rx="4" fill="#0284c7" fill-opacity="0.25"/>
      <text x="100" y="135" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="800">BroadcastChannel (0ms)</text>
      
      <text x="100" y="172" text-anchor="middle" fill="#a5b4fc" font-size="11">Storage Events (Tabs)</text>
      <text x="100" y="202" text-anchor="middle" fill="#94a3b8" font-size="11">Hub HTTP /api/sync (LAN)</text>
      <text x="100" y="232" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700">Firebase RTDB (Nuvem)</text>
      
      <text x="100" y="268" text-anchor="middle" fill="#64748b" font-size="9.5">Fallback em 4 camadas</text>
    </g>
  </g>

  <!-- Center to Right Line -->
  <line x1="560" y1="195" x2="660" y2="195" stroke="#818cf8" stroke-width="3" stroke-dasharray="6,4"/>
  <g transform="translate(660, 195)">
    <circle cx="0" cy="0" r="6" fill="#818cf8" class="anim-dot-bwd"/>
  </g>

  <!-- Right: Audience Mobile -->
  <g transform="translate(635, 60)">
    <rect width="250" height="295" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="42" rx="12" fill="#4f46e5" fill-opacity="0.3"/>
    <text x="125" y="27" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="800">📱 SMARTPHONE DO PÚBLICO</text>

    <text x="20" y="76" fill="#e2e8f0" font-size="12" font-weight="700">• Detalhamento Técnico</text>
    <text x="20" y="98" fill="#94a3b8" font-size="11">Tabelas, listas e links</text>
    
    <text x="20" y="136" fill="#e2e8f0" font-size="12" font-weight="700">• Voto com 1 Toque</text>
    <text x="20" y="158" fill="#94a3b8" font-size="11">Feedback tátil háptico</text>

    <text x="20" y="196" fill="#e2e8f0" font-size="12" font-weight="700">• Envio de Dúvidas</text>
    <text x="20" y="218" fill="#94a3b8" font-size="11">Pseudônimo anônimo seguro</text>

    <g transform="translate(15, 242)">
      <rect width="220" height="38" rx="6" fill="#0f172a" stroke="#6366f1"/>
      <text x="110" y="24" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700">Zero apps para instalar</text>
    </g>
  </g>
</svg>
