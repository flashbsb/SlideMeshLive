<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Participante | Apresentação Interativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/audience.css">
</head>
<body class="audience-body">

  <!-- Header Sticky do Smartphone -->
  <header class="audience-header">
    <div class="audience-brand">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="badge badge-live" style="font-size: 10px; padding: 2px 6px;">AO VIVO</span>
        <span class="audience-slide-indicator" id="audience-slide-indicator">0/0</span>
      </div>
      <div class="audience-pres-name" id="audience-pres-name">Carregando...</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="badge" id="session-badge" style="font-size: 10px; font-family: var(--font-mono);">
        #<span id="session-badge-code">---</span>
      </span>
    </div>
  </header>

  <!-- Conteúdo Principal do Smartphone -->
  <main class="audience-container" id="audience-content-area">
    <div class="card" style="text-align: center; color: var(--text-secondary); padding: 40px 20px;">
      <p>Carregando conteúdo do slide...</p>
    </div>
  </main>

  <!-- Barra Flutuante de Navegação e Ações no Smartphone -->
  <nav class="audience-bottom-bar">
    <button class="audience-action-btn" id="btn-audience-prev" title="Slide Anterior">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      <span>Anterior</span>
    </button>

    <button class="audience-action-btn active" id="btn-audience-sync" title="Sincronizado ao Vivo">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Ao Vivo</span>
    </button>

    <button class="audience-action-btn" id="btn-audience-next" title="Próximo Slide">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
      <span>Próximo</span>
    </button>
  </nav>

  <!-- Script da Aplicação Mobile -->
  <script type="module" src="../js/audience/audience-app.js"></script>
</body>
</html>
