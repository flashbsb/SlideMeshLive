<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Apresentação HTML Interativa Sincronizada</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .portal-hero {
      max-width: 900px;
      margin: 60px auto 30px;
      padding: 0 20px;
      text-align: center;
    }
    .portal-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .portal-subtitle {
      font-size: 16.5px;
      color: var(--text-secondary);
      max-width: 680px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      max-width: 1080px;
      margin: 0 auto 60px;
      padding: 0 20px;
    }
    .presentation-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all var(--transition-fast);
      position: relative;
      overflow: hidden;
    }
    .presentation-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-primary) 0%, #818cf8 100%);
      opacity: 0.6;
    }
    .presentation-card:hover {
      border-color: var(--accent-primary);
      transform: translateY(-3px);
      box-shadow: 0 16px 32px -12px var(--accent-glow);
    }
    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 24px;
    }
    .card-actions .btn {
      padding: 8px 6px;
      font-size: 11.5px;
      text-align: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header style="padding: 18px 40px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center;">
    <div style="font-weight: 800; font-size: 16px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px;">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: var(--accent-primary); display: inline-block; box-shadow: 0 0 10px var(--accent-primary);"></span>
      <span style="color: #ffffff;">Apresentação Online</span>
      <span class="badge" style="font-size: 10px; font-weight: 600; font-family: var(--font-mono);">Multi-Apresentações</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="badge badge-accent">⚡ Sincronização em Tempo Real</span>
    </div>
  </header>

  <main>
    <section class="portal-hero animate-fade-in">
      <h1 class="portal-title">Plataforma de Apresentação HTML Sincronizada</h1>
      <p class="portal-subtitle">
        Projeções web de alto impacto com controle remoto da mesa técnica e sincronização instantânea com os smartphones do público via QR Code.
      </p>
    </section>

    <!-- Grid de Cards Carregado Dinamicamente -->
    <section class="cards-grid" id="catalog-cards-container">
      <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px;">
        Carregando apresentações disponíveis...
      </div>
    </section>
  </main>

  <script type="module">
    async function loadCatalog() {
      const container = document.getElementById('catalog-cards-container');
      try {
        const res = await fetch('presentations/catalog.json?t=' + Date.now());
        if (!res.ok) throw new Error('Não foi possível carregar presentations/catalog.json');
        const data = await res.json();
        const presentations = data.presentations || [];

        let html = presentations.map(p => `
          <article class="presentation-card animate-fade-in">
            <div>
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 8px;">
                <span class="badge ${p.badgeClass || 'badge-accent'}">${p.code || p.id}</span>
                <span class="badge" style="font-size: 10.5px;">${p.totalSlides} Slide(s)</span>
              </div>
              <div style="font-size: 11px; color: var(--accent-primary); font-weight: 700; margin-bottom: 4px;">
                ${p.securityLabel || 'Pública'}
              </div>
              <h2 style="font-size: 18.5px; font-weight: 700; color: #ffffff; margin-bottom: 8px; line-height: 1.3;">
                ${p.title}
              </h2>
              <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.55;">
                ${p.description}
              </p>
            </div>

            <div class="card-actions">
              <a href="presenter/?presentation=${encodeURIComponent(p.id)}&session=${encodeURIComponent(p.defaultSession || 'SES2026')}" class="btn btn-primary" title="Abrir Telão Principal">
                🖥️ Telão
              </a>
              <a href="admin/?presentation=${encodeURIComponent(p.id)}&session=${encodeURIComponent(p.defaultSession || 'SES2026')}" class="btn" style="border-color: rgba(129, 140, 248, 0.4); color: #c7d2fe;" title="Abrir Mesa Técnica e Moderação">
                🛡️ Painel
              </a>
              <a href="audience/?presentation=${encodeURIComponent(p.id)}&session=${encodeURIComponent(p.defaultSession || 'SES2026')}" class="btn" title="Abrir Visão do Smartphone">
                📱 Celular
              </a>
            </div>
          </article>
        `).join('');

        // Card explicativo de como adicionar novas apresentações
        html += `
          <article class="presentation-card animate-fade-in" style="border-style: dashed; background: rgba(15,23,42,0.4);">
            <div>
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                <span class="badge" style="background: rgba(16,185,129,0.15); color: #6ee7b7; border-color: rgba(16,185,129,0.3);">+ Modular</span>
                <span class="badge">JSON</span>
              </div>
              <h2 style="font-size: 18.5px; font-weight: 700; color: #ffffff; margin-bottom: 8px; line-height: 1.3;">
                Adicionar Nova Apresentação
              </h2>
              <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.55;">
                Crie uma pasta em <code>presentations/&lt;nome&gt;/</code> contendo <code>manifest.json</code> e <code>slides.json</code> e registre no <code>presentations/catalog.json</code>.
              </p>
            </div>

            <div style="margin-top: 24px;">
              <a href="README.md" class="btn" style="width: 100%; text-align: center; justify-content: center;" target="_blank">
                📖 Ver Guia de Apresentações
              </a>
            </div>
          </article>
        `;

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #fca5a5; padding: 30px;">
            Erro ao carregar catálogo de apresentações: ${err.message}
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadCatalog);
  </script>

</body>
</html>
